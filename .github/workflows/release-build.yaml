name: Release signing E2E (fork only)

on:
  push:
    tags:
      - 'v0.0.0-signing-e2e.*'
jobs:
  image-publish:
    if: github.repository == 'dm3ch/karpenter-provider-gcp'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image.outputs.reference }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Set tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_ENV
          echo "tag_semver=${TAG#v}" >> $GITHUB_ENV
        shell: bash

      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Log in to fork GHCR test package
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Build and publish image
        id: image
        env:
          IMAGE_TAG: ${{ env.tag }}
        run: |
          export KO_DOCKER_REPO=ghcr.io/dm3ch/karpenter-provider-gcp-signing-e2e
          IMAGE=$(ko build --bare github.com/cloudpilot-ai/karpenter-provider-gcp/cmd/controller \
            --tags "$IMAGE_TAG" --sbom=spdx --sbom-dir "$RUNNER_TEMP/sboms")
          # ko includes the release tag before the digest; retain the immutable reference.
          IMAGE=${IMAGE/":$IMAGE_TAG@"/@}
          [[ "$IMAGE" =~ ^ghcr\.io/dm3ch/karpenter-provider-gcp-signing-e2e@sha256:[a-f0-9]{64}$ ]] || {
            echo 'Expected exactly one digest-qualified controller image from ko build' >&2
            exit 1
          }
          echo "reference=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=${IMAGE##*@}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$IMAGE" > "$RUNNER_TEMP/sboms/image-reference.txt"

      - name: Sign image
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          # Public ECR: retain digest-derived .sig tags rather than OCI 1.1 referrers.
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            --registry-referrers-mode=legacy "$IMAGE"

      - name: Verify image signature
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          cosign verify --new-bundle-format=false --experimental-oci11=false \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/dm3ch/karpenter-provider-gcp-signing-e2e
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: false

      - name: Retain SPDX SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-sboms
          path: ${{ runner.temp }}/sboms/
          if-no-files-found: error

  package-chart:
    if: github.repository == 'dm3ch/karpenter-provider-gcp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: chart-pages-publish
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_ENV
          echo "tag_semver=${TAG#v}" >> $GITHUB_ENV
        shell: bash

      - name: Checkout
        uses: actions/checkout@v7

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3

      - name: Fetch existing Pages index
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          # Fail on any error except 404 (first-ever deployment has no index yet)
          HTTP_CODE=$(curl -sSL -o /tmp/merge-index.yaml -w "%{http_code}" "${PAGES_URL}/index.yaml")
          if [ "${HTTP_CODE}" = "404" ]; then
            rm -f /tmp/merge-index.yaml
            echo "No existing index (first deployment)."
          elif [ "${HTTP_CODE}" != "200" ]; then
            echo "ERROR: Failed to fetch Pages index — HTTP ${HTTP_CODE}. Aborting to avoid losing old chart versions."
            exit 1
          fi

      - name: Snapshot all old chart bytes, signatures, keys and index records
        run: |
          python .github/signing-e2e/history.py snapshot \
            --url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" \
            --index /tmp/merge-index.yaml --snapshot "$RUNNER_TEMP/history-before.json"

      - name: Seed unexpected pre-existing source archives
        run: |
          printf 'untrusted source archive %s' "$GITHUB_RUN_ID" > "charts/karpenter-$tag_semver.tgz"
          printf 'untrusted extra archive %s' "$GITHUB_RUN_ID" > "charts/unexpected-$tag_semver.tgz"

      - name: Build chart dependencies
        run: |
          # charts/ is not committed; helm package fails without the pinned subchart archives
          helm dependency build charts/karpenter

      - name: Import chart signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.SIGNING_E2E_HELM_KEY_BASE64 }}
          passphrase: ${{ secrets.SIGNING_E2E_HELM_KEY_PASSPHRASE }}

      - name: Prepare Helm signing keyring
        id: signing
        env:
          HELM_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_E2E_HELM_KEY_PASSPHRASE }}
          HELM_SIGNING_KEY_FINGERPRINT: ${{ vars.SIGNING_E2E_HELM_KEY_FINGERPRINT }}
          IMPORTED_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          set +x
          : "${HELM_SIGNING_KEY_PASSPHRASE:?passphrase required}"
          [[ "$HELM_SIGNING_KEY_FINGERPRINT" =~ ^[A-F0-9]{40}$ ]]
          [[ "$IMPORTED_FINGERPRINT" == "$HELM_SIGNING_KEY_FINGERPRINT" ]]
          KEYRING_DIR=$(mktemp -d "$RUNNER_TEMP/helm-signing.XXXXXX")
          echo "keyring=$KEYRING_DIR" >> "$GITHUB_OUTPUT"
          CHARTS_DIR=$(mktemp -d "$RUNNER_TEMP/chart-release.XXXXXX")
          echo "charts=$CHARTS_DIR" >> "$GITHUB_OUTPUT"
          printf '%s' "$HELM_SIGNING_KEY_PASSPHRASE" > "$KEYRING_DIR/passphrase"
          # Helm needs an exported legacy keyring rather than GnuPG's .kbx database.
          gpg --batch --pinentry-mode loopback --passphrase-file "$KEYRING_DIR/passphrase" \
            --export-secret-keys "$IMPORTED_FINGERPRINT" > "$KEYRING_DIR/secring.gpg"
          gpg --batch --export "$IMPORTED_FINGERPRINT" > "$KEYRING_DIR/pubring.gpg"

      - name: Package and sign new chart versions
        env:
          KEYRING_DIR: ${{ steps.signing.outputs.keyring }}
          CHARTS_DIR: ${{ steps.signing.outputs.charts }}
          KEY_NAME: ${{ steps.gpg.outputs.name }}
        run: |
          helm package charts/karpenter --version "$tag_semver" --app-version "$tag" \
            --sign --key "$KEY_NAME" --keyring "$KEYRING_DIR/secring.gpg" \
            --passphrase-file "$KEYRING_DIR/passphrase" --destination "$CHARTS_DIR"
          helm package charts/karpenter-crd --version "$tag_semver" --app-version "$tag" \
            --sign --key "$KEY_NAME" --keyring "$KEYRING_DIR/secring.gpg" \
            --passphrase-file "$KEYRING_DIR/passphrase" --destination "$CHARTS_DIR"

      - name: Verify chart signatures
        env:
          KEYRING_DIR: ${{ steps.signing.outputs.keyring }}
          CHARTS_DIR: ${{ steps.signing.outputs.charts }}
        run: |
          helm verify "$CHARTS_DIR/karpenter-$tag_semver.tgz" --keyring "$KEYRING_DIR/pubring.gpg"
          helm verify "$CHARTS_DIR/karpenter-crd-$tag_semver.tgz" --keyring "$KEYRING_DIR/pubring.gpg"

      - name: Record chart signing key
        env:
          CHARTS_DIR: ${{ steps.signing.outputs.charts }}
          FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          mkdir -p "$CHARTS_DIR/keys"
          gpg --batch --armor --export "$FINGERPRINT" > "$CHARTS_DIR/keys/$FINGERPRINT.asc"
          printf '%s %s\n' "karpenter-$tag_semver.tgz" "$FINGERPRINT" > "$CHARTS_DIR/signed-charts.txt"
          printf '%s %s\n' "karpenter-crd-$tag_semver.tgz" "$FINGERPRINT" >> "$CHARTS_DIR/signed-charts.txt"

      - name: Attest chart build provenance
        id: chart-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.signing.outputs.charts }}/karpenter-${{ env.tag_semver }}.tgz
            ${{ steps.signing.outputs.charts }}/karpenter-crd-${{ env.tag_semver }}.tgz

      - name: Verify attestation contains exactly the two new chart subjects
        env:
          BUNDLE: ${{ steps.chart-attestation.outputs.bundle-path }}
          CHARTS_DIR: ${{ steps.signing.outputs.charts }}
        run: python .github/signing-e2e/check-subjects.py

      - name: Update Helm repo index
        env:
          CHARTS_DIR: ${{ steps.signing.outputs.charts }}
        run: |
          # Old .tgz files are intentionally absent here: --merge only preserves 'created'
          # timestamps for versions NOT found on disk. Running index before restoring old
          # archives ensures historical timestamps are copied from the Pages index as-is.
          if [ -f /tmp/merge-index.yaml ]; then
            helm repo index "$CHARTS_DIR" --merge /tmp/merge-index.yaml
          else
            helm repo index "$CHARTS_DIR"
          fi

      - name: Restore previously published chart versions
        env:
          CHARTS_DIR: ${{ steps.signing.outputs.charts }}
        run: |
          set -euo pipefail
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          if [ -f /tmp/merge-index.yaml ]; then
            helm repo add karpenter-gcp "${PAGES_URL}" --force-update

            for CHART in karpenter karpenter-crd; do
              VERSIONS=$(helm search repo "karpenter-gcp/${CHART}" --versions --devel -o json | jq -r '.[].version')
              [ -z "${VERSIONS}" ] && continue

              echo "${VERSIONS}" | while read VERSION; do
                if [ ! -f "$CHARTS_DIR/${CHART}-${VERSION}.tgz" ]; then
                  echo "Pulling ${CHART} ${VERSION}..."
                  helm pull "karpenter-gcp/${CHART}" --version "${VERSION}" --devel --destination "$CHARTS_DIR" || \
                    echo "WARNING: could not pull ${CHART} ${VERSION}, skipping"
                fi
              done

              # Fail rather than deploy an incomplete repo
              ACTUAL=0
              for V in ${VERSIONS}; do
                [ -f "$CHARTS_DIR/${CHART}-${V}.tgz" ] && ACTUAL=$((ACTUAL + 1))
              done
              EXPECTED=$(echo "${VERSIONS}" | grep -c .)
              if [ "${ACTUAL}" -lt "${EXPECTED}" ]; then
                echo "ERROR: Expected ${EXPECTED} ${CHART} archives but only have ${ACTUAL}. Aborting."
                exit 1
              fi
            done
          fi

          PREVIOUS="$RUNNER_TEMP/previous-signed-charts.txt"
          HTTP_CODE=$(curl -sSL -o "$PREVIOUS" -w '%{http_code}' "$PAGES_URL/signed-charts.txt")
          case "$HTTP_CODE" in
            200) ;;
            404) : > "$PREVIOUS" ;;
            *) echo "Failed to fetch signed chart history: HTTP $HTTP_CODE" >&2; exit 1 ;;
          esac
          while read -r ARCHIVE FINGERPRINT; do
            [[ "$ARCHIVE" =~ ^karpenter(-crd)?-[0-9][A-Za-z0-9.+-]*\.tgz$ ]]
            [[ "$FINGERPRINT" =~ ^[A-F0-9]{40}$ ]]
            # A known-signed version must never silently become unsigned.
            test -f "$CHARTS_DIR/$ARCHIVE"
            if [ ! -f "$CHARTS_DIR/$ARCHIVE.prov" ]; then
              curl --fail -sSL "$PAGES_URL/$ARCHIVE.prov" -o "$CHARTS_DIR/$ARCHIVE.prov"
            fi
            if [ ! -f "$CHARTS_DIR/keys/$FINGERPRINT.asc" ]; then
              curl --fail -sSL "$PAGES_URL/keys/$FINGERPRINT.asc" -o "$CHARTS_DIR/keys/$FINGERPRINT.asc"
            fi
          done < "$PREVIOUS"
          for ARCHIVE in "$CHARTS_DIR"/*.tgz; do
            [ -f "$ARCHIVE.prov" ] && continue
            HTTP_CODE=$(curl -sSL -o "$ARCHIVE.prov" -w '%{http_code}' "$PAGES_URL/$(basename "$ARCHIVE").prov")
            case "$HTTP_CODE" in
              200) ;;
              404) rm "$ARCHIVE.prov" ;; # Old unsigned chart, absent from the signed history.
              *) echo "Failed to restore $ARCHIVE.prov: HTTP $HTTP_CODE" >&2; exit 1 ;;
            esac
          done
          sort -u "$PREVIOUS" "$CHARTS_DIR/signed-charts.txt" > "$RUNNER_TEMP/signed-charts.txt"
          mv "$RUNNER_TEMP/signed-charts.txt" "$CHARTS_DIR/signed-charts.txt"

      - name: Refuse deployment if old chart history or signature bytes changed
        env:
          CHARTS_DIR: ${{ steps.signing.outputs.charts }}
        run: |
          python .github/signing-e2e/history.py check-local \
            --directory "$CHARTS_DIR" --snapshot "$RUNNER_TEMP/history-before.json"
          test ! -e "$CHARTS_DIR/unexpected-$tag_semver.tgz"

      - name: Retain baseline preservation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-history-before
          path: ${{ runner.temp }}/history-before.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.signing.outputs.charts }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Remove exported chart signing keyring
        if: always() && steps.signing.outputs.keyring != ''
        env:
          KEYRING_DIR: ${{ steps.signing.outputs.keyring }}
        run: rm -rf "$KEYRING_DIR"

  verify-published:
    needs: [image-publish, package-chart]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ${{ needs.image-publish.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart-history-before
          path: ${{ runner.temp }}/baseline
      - name: Verify actual published artifacts and negative cases
        run: python .github/signing-e2e/verify-published.py
      - name: Verify old published chart bytes and signature files are unchanged
        run: |
          python .github/signing-e2e/history.py check-published \
            --url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" \
            --snapshot "$RUNNER_TEMP/baseline/history-before.json"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-verification
          path: ${{ runner.temp }}/verification
          if-no-files-found: warn
