name: Maintenance

on:
  schedule:
    # Weekly on Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview updates without opening pull requests
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  pricing:
    name: Pricing data
    if: github.repository == 'karpenter-gcp/karpenter-provider-gcp'
    runs-on: ubuntu-latest
    concurrency:
      group: update-pricing
      cancel-in-progress: false
    # Pricing alone receives GCP credentials; retain the existing updater steps.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_PRICING_SA_KEY }}

      - name: Set GCP project
        env:
          PRICING_PROJECT: ${{ vars.GCP_PRICING_PROJECT }}
        run: echo "GOOGLE_CLOUD_PROJECT=$PRICING_PROJECT" >> "$GITHUB_ENV"

      - name: Update initial-prices.json
        run: make update-pricing

      - name: Create publication token
        if: github.event_name == 'schedule' || !inputs.dry_run
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create PR if pricing changed
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PR_BRANCH: automated/update-pricing
          PR_BASE: ${{ github.ref_name }}
          PR_LABELS: pricing,automated,kind/cleanup
          PR_TITLE: "chore(pricing): scheduled pricing data refresh"
          PR_BODY: |
            #### What type of PR is this?
            Cleanup

            #### What this PR does / why we need it:
            Refresh generated GCP pricing data in `pkg/providers/pricing/initial-prices.json`.

            #### Related proposal (if applicable):
            N/A

            #### Which issue(s) this PR fixes:
            N/A

            #### Docs and examples
            - [x] `docs/` and `examples/` updated (or this PR does not affect user-facing behaviour, configuration, or APIs)
            - [x] `MIGRATION.md` updated (or this PR does not require any migration steps)

            #### Special notes for your reviewer:
            Automated pricing refresh; review the generated data before merging. A maintainer must approve through GitHub Review because the automation App cannot approve its own PR.
        run: |
          paths=(pkg/providers/pricing/initial-prices.json)
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo "No changes to publish."
            if git ls-remote --exit-code --heads origin "$PR_BRANCH" >/dev/null; then
              # Deleting the branch closes its pull request.
              git push origin --delete "$PR_BRANCH"
            fi
            exit 0
          fi

          app_id="$(gh api "users/${PR_APP_SLUG}[bot]" --jq .id)"
          git config user.name "${PR_APP_SLUG}[bot]"
          git config user.email "${app_id}+${PR_APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch -C "$PR_BRANCH"
          git add -- "${paths[@]}"
          git commit --signoff --message "$PR_TITLE"

          # Rewriting an identical branch would dismiss approvals and rerun checks.
          if git fetch --depth=1 origin "$PR_BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "Branch $PR_BRANCH already holds this change."
          else
            git push --force origin "$PR_BRANCH"
          fi

          number="$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$PR_TITLE" --body "$PR_BODY" --add-label "$PR_LABELS"
          else
            gh pr create --draft --base "$PR_BASE" --head "$PR_BRANCH" \
              --title "$PR_TITLE" --body "$PR_BODY" --label "$PR_LABELS"
          fi

  security-pins:
    name: Security pins (Go, base image)
    if: github.repository == 'karpenter-gcp/karpenter-provider-gcp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: update-security-pins
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: updatecli/updatecli-action@v3.11.0
      - name: Validate updater manifest
        run: updatecli manifest validate --strict --config .github/updatecli.yaml
      - name: Refresh compiler patch and base index
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            updatecli pipeline diff --config .github/updatecli.yaml --disable-udash-report --disable-changelog
          else
            updatecli pipeline apply --config .github/updatecli.yaml --disable-udash-report --disable-changelog
          fi
          git diff --check
      # Keep publication separate: Updatecli's native PR cleanup posts comments.
      - name: Create publication token
        if: github.event_name == 'schedule' || !inputs.dry_run
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open draft update PR
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PR_BRANCH: automated/security-pins
          PR_BASE: main
          PR_LABELS: automated,kind/cleanup
          PR_TITLE: 'chore(security): refresh Go patch and controller base'
          PR_BODY: |
            #### What type of PR is this?
            Cleanup

            #### What this PR does / why we need it:
            Refresh Go within the current minor release and the controller base-image digest to pick up upstream security fixes. No module dependency upgrades or automatic merge.

            #### Related proposal (if applicable):
            N/A

            #### Which issue(s) this PR fixes:
            N/A

            #### Docs and examples
            - [x] `docs/` and `examples/` updated (or this PR does not affect user-facing behaviour, configuration, or APIs)
            - [x] `MIGRATION.md` updated (or this PR does not require any migration steps)

            #### Special notes for your reviewer:
            Published by the automation App so pull-request checks can run. A maintainer must approve this PR through GitHub Review because the App cannot approve its own PR. Rebuilding is required to deliver fixes in published images.
        run: |
          paths=(go.mod hack/tools/go.mod hack/crd-tools/go.mod hack/pdcsi-data/go.mod .ko.yaml)
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo "No changes to publish."
            exit 0
          fi

          app_id="$(gh api "users/${PR_APP_SLUG}[bot]" --jq .id)"
          git config user.name "${PR_APP_SLUG}[bot]"
          git config user.email "${app_id}+${PR_APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch -C "$PR_BRANCH"
          git add -- "${paths[@]}"
          git commit --signoff --message "$PR_TITLE"

          # Rewriting an identical branch would dismiss approvals and rerun checks.
          if git fetch --depth=1 origin "$PR_BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "Branch $PR_BRANCH already holds this change."
          else
            git push --force origin "$PR_BRANCH"
          fi

          number="$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$PR_TITLE" --body "$PR_BODY" --add-label "$PR_LABELS"
          else
            gh pr create --draft --base "$PR_BASE" --head "$PR_BRANCH" \
              --title "$PR_TITLE" --body "$PR_BODY" --label "$PR_LABELS"
          fi
