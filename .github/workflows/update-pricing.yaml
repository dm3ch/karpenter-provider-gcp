# Pricing data codegen workflow.
#
# Mirrors the approach used by karpenter-provider-aws (.github/workflows/codegen.yaml):
# a scheduled job regenerates embedded pricing data from the cloud provider's
# billing API, commits to a dedicated branch, and opens a PR for review.
#
# Reference: https://github.com/aws/karpenter-provider-aws/blob/main/.github/workflows/codegen.yaml
#
# Required repository configuration:
#   Secret  GCP_PRICING_SA_KEY     — service account key JSON
#   Variable GCP_PRICING_PROJECT   — GCP project ID
#
# A free-tier GCP project is sufficient. The service account only needs:
#   roles/billing.viewer  — read SKU prices from the Billing Catalog API
#   roles/compute.viewer  — read machine type specs and region list
name: Update pricing data

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate prices without opening a PR (skips the Create PR step)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_PRICING_SA_KEY }}

      - name: Set GCP project
        run: echo "GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PRICING_PROJECT }}" >> $GITHUB_ENV

      - name: Run price validation
        id: validate
        run: |
          tmpdir=$(mktemp -d)
          echo "workdir=${tmpdir}" >> "$GITHUB_OUTPUT"
          go run ./hack/tools/price_validate --work-dir="${tmpdir}" 2>&1 | tee "${tmpdir}/output.txt"

      - name: Update initial-prices.json
        run: |
          cp "${{ steps.validate.outputs.workdir }}/computed.json" pkg/providers/pricing/initial-prices.json

      - name: Prepare PR body
        env:
          VALIDATE_OUTPUT: ${{ steps.validate.outputs.workdir }}/output.txt
        run: |
          {
            echo 'Automated refresh of `pkg/providers/pricing/initial-prices.json`'
            echo 'from the GCP Billing Catalog API.'
            echo ''
            echo 'Review the diff to verify pricing changes are reasonable.'
            echo ''
            echo '<details>'
            echo '<summary>Price validation output</summary>'
            echo ''
            echo '```'
            cat "${VALIDATE_OUTPUT}"
            echo '```'
            echo ''
            echo '</details>'
          } > /tmp/pr-body.md

      - name: Create PR if pricing changed
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(pricing): update initial-prices.json"
          title: "chore(pricing): scheduled pricing data refresh"
          body-path: /tmp/pr-body.md
          branch: automated/update-pricing
          delete-branch: true
          labels: pricing,automated
